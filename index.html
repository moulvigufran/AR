<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- Chroma Key Shader to erase green background -->
    <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
    <!-- Nothing OS-style Dot Matrix & Monospace Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --nothing-black: #000000;
        --nothing-surface: #111111;
        --nothing-border: #2a2a2a;
        --nothing-white: #ffffff;
        --nothing-muted: #888888;
        --nothing-red: #D71921;
      }

      body { 
        margin: 0; 
        overflow: hidden; 
        background: var(--nothing-black);
        font-family: 'Space Mono', monospace;
        -webkit-font-smoothing: antialiased;
      }

      body.ar-active {
        touch-action: none;
      }

      /* ================= NOTHING OS SPLASH SCREEN ================= */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--nothing-black);
        background-image: radial-gradient(#222222 1px, transparent 1px);
        background-size: 18px 18px;
        color: var(--nothing-white);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 36px 24px;
        box-sizing: border-box;
        text-align: center;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }

      #splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        display: none;
      }

      .nothing-top-bar {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        letter-spacing: 2px;
        color: var(--nothing-muted);
        border-bottom: 1px dashed var(--nothing-border);
        padding-bottom: 12px;
      }

      .rec-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        background-color: var(--nothing-red);
        border-radius: 50%;
        margin-right: 6px;
        animation: pulseRed 1.5s infinite;
      }

      @keyframes pulseRed {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }

      .brand-content {
        margin-top: auto;
        margin-bottom: auto;
        max-width: 440px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Animated Dot-Matrix Title Morph */
      .morph-wrapper {
        min-height: 84px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-bottom: 20px;
      }

      .acronym-expansion {
        font-family: 'DotGothic16', monospace;
        font-size: 22px;
        line-height: 1.4;
        color: var(--nothing-muted);
        letter-spacing: 1px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: baseline;
        gap: 8px;
        transition: all 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .word-group {
        display: inline-flex;
        align-items: baseline;
        transition: all 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .hi-letter {
        color: var(--nothing-white);
        font-weight: 700;
        display: inline-block;
        transition: all 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .rest-word {
        display: inline-block;
        max-width: 140px;
        opacity: 1;
        overflow: hidden;
        white-space: nowrap;
        vertical-align: bottom;
        transition: max-width 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
      }

      .morph-wrapper.collapsed .acronym-expansion {
        gap: 4px;
      }

      .morph-wrapper.collapsed .rest-word {
        max-width: 0px;
        opacity: 0;
      }

      .morph-wrapper.collapsed .hi-letter {
        font-size: 54px;
        letter-spacing: 8px;
        color: var(--nothing-white);
      }

      /* Micro "ARCHITECTURE" Text */
      .tiny-architecture {
        font-family: 'Space Mono', monospace;
        font-size: 8px;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--nothing-red);
        opacity: 0;
        transform: translateY(-4px);
        margin-top: 6px;
        font-weight: 700;
        transition: opacity 0.7s ease 0.4s, transform 0.7s ease 0.4s;
      }

      .morph-wrapper.collapsed .tiny-architecture {
        opacity: 1;
        transform: translateY(0);
      }

      .nothing-card {
        background: var(--nothing-surface);
        border: 1px solid var(--nothing-border);
        border-radius: 16px;
        padding: 18px 20px;
        margin-bottom: 28px;
        max-width: 360px;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.7s ease 0.5s, transform 0.7s ease 0.5s;
      }

      .nothing-card.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .brand-definition {
        font-size: 12px;
        line-height: 1.65;
        color: #cccccc;
        margin: 0;
        text-align: left;
      }

      #start-ar-btn {
        background: var(--nothing-white);
        color: var(--nothing-black);
        border: none;
        padding: 16px 36px;
        font-family: 'DotGothic16', monospace;
        font-size: 15px;
        letter-spacing: 2px;
        text-transform: uppercase;
        border-radius: 999px;
        cursor: pointer;
        position: relative;
        z-index: 10000;
        -webkit-tap-highlight-color: transparent;
      }

      #start-ar-btn:active {
        background: var(--nothing-red);
        color: var(--nothing-white);
        transform: scale(0.95);
      }

      .author-credit {
        font-family: 'DotGothic16', monospace;
        font-size: 13px;
        letter-spacing: 3px;
        color: var(--nothing-muted);
        text-transform: uppercase;
        border-top: 1px dashed var(--nothing-border);
        width: 100%;
        padding-top: 12px;
      }

      .author-credit span {
        color: var(--nothing-white);
      }

      /* ================= NOTHING OS CAMERA HUD ================= */
      #info-overlay {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: rgba(0, 0, 0, 0.85);
        color: var(--nothing-white);
        border: 1px solid var(--nothing-border);
        padding: 10px 18px;
        border-radius: 999px;
        font-family: 'DotGothic16', monospace;
        font-size: 13px;
        letter-spacing: 1px;
        text-align: center;
        pointer-events: none;
        width: 82%;
        max-width: 320px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      #ar-controls {
        position: absolute;
        bottom: 42px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        display: flex;
        gap: 8px;
        background: rgba(0, 0, 0, 0.85);
        border: 1px solid var(--nothing-border);
        padding: 6px 10px;
        border-radius: 999px;
      }

      .ctrl-btn {
        background: var(--nothing-surface);
        color: var(--nothing-white);
        border: 1px solid var(--nothing-border);
        border-radius: 999px;
        padding: 8px 12px;
        font-family: 'Space Mono', monospace;
        font-size: 11px;
        cursor: pointer;
        user-select: none;
      }

      .ctrl-btn:active {
        background: var(--nothing-red);
        border-color: var(--nothing-red);
      }

      #ar-footer-credit {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        color: rgba(255, 255, 255, 0.7);
        font-family: 'DotGothic16', monospace;
        font-size: 11px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>

    <!-- Nothing OS Opening Splash Screen -->
    <div id="splash-screen">
      <div class="nothing-top-bar">
        <span><span class="rec-dot"></span>SYS.READY</span>
        <span>AR // V1.0</span>
      </div>

      <div class="brand-content">
        <div class="morph-wrapper" id="morph-title">
          <div class="acronym-expansion">
            <span class="word-group"><span class="hi-letter">T</span><span class="rest-word">opical</span></span>
            <span class="word-group"><span class="hi-letter">A</span><span class="rest-word">rticle &amp;</span></span>
            <span class="word-group"><span class="hi-letter">N</span><span class="rest-word">avigation</span></span>
            <span class="word-group"><span class="hi-letter">U</span><span class="rest-word">nit</span></span>
          </div>
          <div class="tiny-architecture">ARCHITECTURE</div>
        </div>

        <div class="nothing-card" id="brand-def">
          <p class="brand-definition">
            [DEFINITION] Spatial anchor framework linking physical print media to perpendicular holographic projections in real time.
          </p>
        </div>

        <button id="start-ar-btn" type="button">INITIALIZE CAMERA &rarr;</button>
      </div>

      <div class="author-credit">BY <span>M GUFRAN</span></div>
    </div>

    <!-- Nothing OS Camera HUD -->
    <div id="info-overlay"><span class="rec-dot"></span><span id="status-text">SCAN TARGET IMAGE...</span></div>

    <!-- Extra Hologram Controls Dock -->
    <div id="ar-controls">
      <button class="ctrl-btn" id="btn-rot-left" type="button">&circlearrowleft;</button>
      <button class="ctrl-btn" id="btn-rot-right" type="button">&circlearrowright;</button>
      <button class="ctrl-btn" id="btn-reset-scale" type="button">1:1</button>
      <button class="ctrl-btn" id="btn-replay" type="button">REPLAY</button>
      <button class="ctrl-btn" id="btn-mute" type="button">MUTE</button>
    </div>

    <div id="ar-footer-credit">TANU &bull; BY M GUFRAN</div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.0001; missTolerance: 25; warmupTolerance: 3;" 
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="holo-vid" 
          src="./tasawur_video.html.mp4" 
          preload="auto" 
          loop="true" 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target Image Anchor -->
      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        
        <!-- Scalable & Manually Rotatable Wrapper (Default A4 scale 1.8, strictly perpendicular) -->
        <a-entity id="hologram-scaler" scale="1.8 1.8 1.8" rotation="0 0 0">
          
          <!-- Minimalist Monochrome & Red Base Emitter Ring -->
          <a-ring 
            color="#ffffff" 
            radius-inner="0.33" 
            radius-outer="0.35" 
            position="0 0 0.005" 
            rotation="0 0 0"
            material="shader: flat; transparent: true; opacity: 0.6;">
          </a-ring>
          <a-ring 
            color="#D71921" 
            radius-inner="0.36" 
            radius-outer="0.375" 
            position="0 0 0.006" 
            rotation="0 0 0"
            material="shader: flat; transparent: true; opacity: 0.85;">
          </a-ring>

          <!-- Strictly Perpendicular (90°) Standing Hologram Plane -->
          <a-plane 
            id="hologram-display"
            material="shader: chromakey; src: #holo-vid; color: 0.0 1.0 0.0; transparent: true; opacity: 0.95; side: double;"
            width="1.6" 
            height="0.9" 
            position="0 0 0.45" 
            rotation="90 0 0">
          </a-plane>

        </a-entity>

      </a-entity>

    </a-scene>

    <script>
      (function () {
        const videoEl = document.getElementById('holo-vid');
        const targetEl = document.getElementById('ar-target');
        const statusText = document.getElementById('status-text');
        const splashScreen = document.getElementById('splash-screen');
        const startBtn = document.getElementById('start-ar-btn');
        const morphTitle = document.getElementById('morph-title');
        const brandDef = document.getElementById('brand-def');
        const scalerEl = document.getElementById('hologram-scaler');

        // 1. Run Morph Animation Immediately (No waiting on heavy 3D assets)
        setTimeout(function () {
          morphTitle.classList.add('collapsed');
          brandDef.classList.add('visible');
        }, 1600);

        // 2. Enter Camera Function (Works on both touch and click)
        function enterCamera(e) {
          if (e) e.preventDefault();
          splashScreen.classList.add('hidden');
          document.body.classList.add('ar-active');
          if (videoEl) {
            videoEl.play().then(function () {
              videoEl.pause();
              videoEl.currentTime = 0;
            }).catch(function () {});
          }
        }

        startBtn.addEventListener('click', enterCamera);
        startBtn.addEventListener('touchend', enterCamera);

        // 3. Play when image is scanned
        targetEl.addEventListener("targetFound", function () {
          splashScreen.classList.add('hidden');
          document.body.classList.add('ar-active');
          videoEl.play().then(function () {
            statusText.innerText = "LOCKED // PINCH TO RESIZE";
          }).catch(function () {
            statusText.innerText = "TAP SCREEN FOR AUDIO";
          });
        });

        // 4. Pause when camera moves away
        targetEl.addEventListener("targetLost", function () {
          videoEl.pause();
          statusText.innerText = "PAUSED // POINT AT IMAGE";
        });

        // 5. Fallback screen tap to unlock audio if needed
        window.addEventListener('click', function (e) {
          if (!splashScreen.classList.contains('hidden')) return;
          if (e.target.closest('#ar-controls')) return;
          if (videoEl.paused && statusText.innerText.includes("AUDIO")) {
            videoEl.play();
            statusText.innerText = "LOCKED // PINCH TO RESIZE";
          }
        });

        // 6. Extra Controls: Manual Angle Rotation, Reset Scale, Replay, Mute
        let zRotation = 0;
        let currentScale = 1.8;

        document.getElementById('btn-rot-left').addEventListener('click', function () {
          zRotation -= 15;
          scalerEl.setAttribute('rotation', '0 0 ' + zRotation);
        });

        document.getElementById('btn-rot-right').addEventListener('click', function () {
          zRotation += 15;
          scalerEl.setAttribute('rotation', '0 0 ' + zRotation);
        });

        document.getElementById('btn-reset-scale').addEventListener('click', function () {
          currentScale = 1.8;
          zRotation = 0;
          scalerEl.setAttribute('scale', '1.8 1.8 1.8');
          scalerEl.setAttribute('rotation', '0 0 0');
        });

        document.getElementById('btn-replay').addEventListener('click', function () {
          videoEl.currentTime = 0;
          videoEl.play();
        });

        const muteBtn = document.getElementById('btn-mute');
        muteBtn.addEventListener('click', function () {
          videoEl.muted = !videoEl.muted;
          muteBtn.innerText = videoEl.muted ? "UNMUTE" : "MUTE";
        });

        // 7. Two-Finger Pinch-to-Resize Gesture (Only active once splash screen closes)
        let initialDistance = null;
        let startScale = 1.8;

        function getTouchDistance(touches) {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          return Math.hypot(dx, dy);
        }

        window.addEventListener('touchstart', function (e) {
          if (!splashScreen.classList.contains('hidden')) return;
          if (e.touches.length === 2) {
            initialDistance = getTouchDistance(e.touches);
            startScale = currentScale;
          }
        }, { passive: false });

        window.addEventListener('touchmove', function (e) {
          if (!splashScreen.classList.contains('hidden')) return;
          if (e.touches.length === 2 && initialDistance) {
            e.preventDefault();
            const newDistance = getTouchDistance(e.touches);
            const ratio = newDistance / initialDistance;
            currentScale = Math.min(Math.max(startScale * ratio, 0.5), 4.5);
            scalerEl.setAttribute('scale', currentScale + ' ' + currentScale + ' ' + currentScale);
          }
        }, { passive: false });

        window.addEventListener('touchend', function (e) {
          if (e.touches.length < 2) {
            initialDistance = null;
          }
        });
      })();
    </script>
  </body>
</html>
