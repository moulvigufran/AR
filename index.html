<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- Nothing OS Dot-Matrix & Technical Monospace Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Built-in Native GLSL Chroma Key Shader -->
    <script>
      AFRAME.registerShader('holo-chromakey', {
        schema: {
          src: { type: 'map' },
          color: { type: 'color', default: '#00ff00' },
          threshold: { type: 'number', default: 0.42 },
          smoothness: { type: 'number', default: 0.12 },
          opacity: { type: 'number', default: 0.95 }
        },
        init: function (data) {
          const videoTexture = new THREE.VideoTexture(data.src);
          videoTexture.minFilter = THREE.LinearFilter;
          videoTexture.magFilter = THREE.LinearFilter;

          this.material = new THREE.ShaderMaterial({
            uniforms: {
              tex: { value: videoTexture },
              keyColor: { value: new THREE.Color(data.color) },
              threshold: { value: data.threshold },
              smoothness: { value: data.smoothness },
              opacity: { value: data.opacity }
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D tex;
              uniform vec3 keyColor;
              uniform float threshold;
              uniform float smoothness;
              uniform float opacity;
              varying vec2 vUv;

              void main() {
                vec4 texColor = texture2D(tex, vUv);
                float diff = distance(texColor.rgb, keyColor);
                float alpha = smoothstep(threshold, threshold + smoothness, diff);
                if (alpha < 0.05) discard;
                gl_FragColor = vec4(texColor.rgb, alpha * opacity);
              }
            `,
            transparent: true,
            side: THREE.DoubleSide
          });
        }
      });
    </script>
    
    <style>
      :root {
        --nothing-bg: #000000;
        --nothing-widget: #141414;
        --nothing-border: #2C2C2C;
        --nothing-white: #FFFFFF;
        --nothing-grey: #8E8E93;
        --nothing-red: #D71921;
      }

      html, body { 
        margin: 0; 
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; 
        background: transparent;
        font-family: 'Space Mono', monospace;
        -webkit-font-smoothing: antialiased;
      }

      body.ar-active {
        touch-action: none;
      }

      /* ================= NOTHING OS SPLASH SCREEN ================= */
      #splash-screen {
        position: fixed;
        inset: 0;
        background-color: var(--nothing-bg);
        background-image: radial-gradient(#262626 1px, transparent 1px);
        background-size: 16px 16px;
        color: var(--nothing-white);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 28px 20px;
        box-sizing: border-box;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }

      #splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Nothing OS Top Status Pill */
      .nothing-header {
        width: 100%;
        max-width: 420px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--nothing-widget);
        border: 1px solid var(--nothing-border);
        border-radius: 999px;
        padding: 10px 18px;
        box-sizing: border-box;
        font-size: 11px;
        letter-spacing: 2px;
        color: var(--nothing-grey);
      }

      .glyph-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: var(--nothing-red);
        border-radius: 50%;
        margin-right: 8px;
        box-shadow: 0 0 8px var(--nothing-red);
        animation: blinkDot 1.4s infinite;
      }

      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      /* Nothing OS Center Widget Card */
      .nothing-widget-box {
        width: 100%;
        max-width: 420px;
        background: var(--nothing-widget);
        border: 1px solid var(--nothing-border);
        border-radius: 32px;
        padding: 44px 24px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
      }

      /* Corner Screw / Glyph Dots */
      .widget-corners {
        width: 100%;
        display: flex;
        justify-content: space-between;
        position: absolute;
        top: 16px;
        left: 0;
        padding: 0 20px;
        box-sizing: border-box;
        pointer-events: none;
      }

      .corner-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #3A3A3C;
      }

      /* Morphing Dot-Matrix Title */
      .morph-wrapper {
        min-height: 110px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-bottom: 36px;
      }

      .acronym-expansion {
        font-family: 'DotGothic16', monospace;
        font-size: 22px;
        line-height: 1.45;
        color: var(--nothing-grey);
        letter-spacing: 1px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: baseline;
        gap: 8px;
        transition: all 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .word-group {
        display: inline-flex;
        align-items: baseline;
        transition: all 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .hi-letter {
        color: var(--nothing-white);
        font-weight: 700;
        display: inline-block;
        transition: all 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .rest-word {
        display: inline-block;
        max-width: 150px;
        opacity: 1;
        overflow: hidden;
        white-space: nowrap;
        vertical-align: bottom;
        transition: max-width 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
      }

      .morph-wrapper.collapsed .acronym-expansion {
        gap: 4px;
      }

      .morph-wrapper.collapsed .rest-word {
        max-width: 0px;
        opacity: 0;
      }

      .morph-wrapper.collapsed .hi-letter {
        font-size: 62px;
        letter-spacing: 10px;
        color: var(--nothing-white);
      }

      /* Ultra-Small "ARCHITECTURE" Tag */
      .tiny-architecture {
        font-family: 'Space Mono', monospace;
        font-size: 8px;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--nothing-red);
        opacity: 0;
        transform: translateY(-4px);
        margin-top: 8px;
        font-weight: 700;
        transition: opacity 0.7s ease 0.4s, transform 0.7s ease 0.4s;
      }

      .morph-wrapper.collapsed .tiny-architecture {
        opacity: 1;
        transform: translateY(0);
      }

      /* Nothing OS Pill Action Button */
      #start-ar-btn {
        background: var(--nothing-white);
        color: var(--nothing-bg);
        border: none;
        padding: 18px 34px;
        font-family: 'DotGothic16', monospace;
        font-size: 15px;
        letter-spacing: 2px;
        text-transform: uppercase;
        border-radius: 999px;
        cursor: pointer;
        width: 100%;
        max-width: 280px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
      }

      #start-ar-btn:active {
        background: var(--nothing-red);
        color: var(--nothing-white);
        transform: scale(0.96);
      }

      /* Nothing OS Bottom Credit Pill */
      .nothing-footer {
        width: 100%;
        max-width: 420px;
        border-top: 1px dashed var(--nothing-border);
        padding-top: 14px;
        font-family: 'DotGothic16', monospace;
        font-size: 13px;
        letter-spacing: 3px;
        color: var(--nothing-grey);
        text-transform: uppercase;
        text-align: center;
      }

      .nothing-footer span {
        color: var(--nothing-white);
      }

      /* ================= NOTHING OS CAMERA HUD ================= */
      #info-overlay {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: rgba(15, 15, 15, 0.9);
        color: var(--nothing-white);
        border: 1px solid var(--nothing-border);
        padding: 10px 18px;
        border-radius: 999px;
        font-family: 'DotGothic16', monospace;
        font-size: 13px;
        letter-spacing: 1px;
        text-align: center;
        pointer-events: none;
        width: 82%;
        max-width: 320px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      #ar-controls {
        position: absolute;
        bottom: 42px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        display: flex;
        gap: 8px;
        background: rgba(15, 15, 15, 0.9);
        border: 1px solid var(--nothing-border);
        padding: 6px 10px;
        border-radius: 999px;
      }

      .ctrl-btn {
        background: #1C1C1E;
        color: var(--nothing-white);
        border: 1px solid var(--nothing-border);
        border-radius: 999px;
        padding: 8px 12px;
        font-family: 'Space Mono', monospace;
        font-size: 11px;
        cursor: pointer;
        user-select: none;
        touch-action: manipulation;
      }

      .ctrl-btn:active {
        background: var(--nothing-red);
        border-color: var(--nothing-red);
      }

      #ar-footer-credit {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        color: rgba(255, 255, 255, 0.75);
        font-family: 'DotGothic16', monospace;
        font-size: 11px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>

    <!-- Nothing OS Opening Splash Screen (Only Full Form -> TANU, No Definition Box) -->
    <div id="splash-screen">
      <div class="nothing-header">
        <span><span class="glyph-dot"></span>TANU.OS</span>
        <span>HOLO // 01</span>
      </div>

      <div class="nothing-widget-box">
        <div class="widget-corners">
          <span class="corner-dot"></span>
          <span class="corner-dot"></span>
        </div>

        <div class="morph-wrapper" id="morph-title">
          <div class="acronym-expansion">
            <span class="word-group"><span class="hi-letter">T</span><span class="rest-word">opical</span></span>
            <span class="word-group"><span class="hi-letter">A</span><span class="rest-word">rticle &amp;</span></span>
            <span class="word-group"><span class="hi-letter">N</span><span class="rest-word">avigation</span></span>
            <span class="word-group"><span class="hi-letter">U</span><span class="rest-word">nit</span></span>
          </div>
          <div class="tiny-architecture">ARCHITECTURE</div>
        </div>

        <button id="start-ar-btn" type="button">INITIALIZE CAMERA &rarr;</button>
      </div>

      <div class="nothing-footer">BY <span>M GUFRAN</span></div>
    </div>

    <!-- Nothing OS Camera HUD -->
    <div id="info-overlay"><span class="glyph-dot"></span><span id="status-text">SCAN TARGET IMAGE...</span></div>

    <!-- Hologram Controls Dock -->
    <div id="ar-controls">
      <button class="ctrl-btn" id="btn-rot-left" type="button">&circlearrowleft;</button>
      <button class="ctrl-btn" id="btn-rot-right" type="button">&circlearrowright;</button>
      <button class="ctrl-btn" id="btn-reset-scale" type="button">1:1</button>
      <button class="ctrl-btn" id="btn-replay" type="button">REPLAY</button>
      <button class="ctrl-btn" id="btn-mute" type="button">MUTE</button>
    </div>

    <div id="ar-footer-credit">TANU &bull; BY M GUFRAN</div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.0001; missTolerance: 25; warmupTolerance: 3;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="holo-vid" 
          src="./tasawur_video.html.mp4" 
          preload="auto" 
          loop="true" 
          muted
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target Image Anchor -->
      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        
        <!-- Scalable & Manually Rotatable Wrapper (Default A4 scale 1.8, strictly perpendicular) -->
        <a-entity id="hologram-scaler" scale="1.8 1.8 1.8" rotation="0 0 0">
          
          <!-- Minimalist Monochrome & Red Base Emitter Ring -->
          <a-ring 
            color="#ffffff" 
            radius-inner="0.33" 
            radius-outer="0.35" 
            position="0 0 0.005" 
            rotation="0 0 0"
            material="shader: flat; transparent: true; opacity: 0.6;">
          </a-ring>
          <a-ring 
            color="#D71921" 
            radius-inner="0.36" 
            radius-outer="0.375" 
            position="0 0 0.006" 
            rotation="0 0 0"
            material="shader: flat; transparent: true; opacity: 0.85;">
          </a-ring>

          <!-- Strictly Perpendicular (90°) Standing Hologram Plane -->
          <a-plane 
            id="hologram-display"
            material="shader: holo-chromakey; src: #holo-vid; color: #00ff00; threshold: 0.42; smoothness: 0.12; opacity: 0.95;"
            width="1.6" 
            height="0.9" 
            position="0 0 0.45" 
            rotation="90 0 0">
          </a-plane>

        </a-entity>

      </a-entity>

    </a-scene>

    <script>
      (function () {
        const videoEl = document.getElementById('holo-vid');
        const targetEl = document.getElementById('ar-target');
        const statusText = document.getElementById('status-text');
        const splashScreen = document.getElementById('splash-screen');
        const startBtn = document.getElementById('start-ar-btn');
        const morphTitle = document.getElementById('morph-title');
        const scalerEl = document.getElementById('hologram-scaler');
        const muteBtn = document.getElementById('btn-mute');

        // 1. Morph Animation: Topical Article & Navigation Unit -> TANU
        setTimeout(function () {
          morphTitle.classList.add('collapsed');
        }, 1600);

        // 2. Enter Camera
        startBtn.addEventListener('click', function () {
          splashScreen.classList.add('hidden');
          document.body.classList.add('ar-active');
          videoEl.muted = false;
          videoEl.play().then(function () {
            videoEl.pause();
            videoEl.currentTime = 0;
          }).catch(function () {
            videoEl.muted = true;
            muteBtn.innerText = "UNMUTE";
          });
        });

        // 3. Play when image is scanned
        targetEl.addEventListener("targetFound", function () {
          splashScreen.classList.add('hidden');
          document.body.classList.add('ar-active');
          videoEl.play().then(function () {
            statusText.innerText = videoEl.muted ? "LOCKED // TAP UNMUTE" : "LOCKED // PINCH TO RESIZE";
          }).catch(function () {
            videoEl.muted = true;
            muteBtn.innerText = "UNMUTE";
            videoEl.play();
            statusText.innerText = "LOCKED // TAP UNMUTE";
          });
        });

        // 4. Pause when camera moves away
        targetEl.addEventListener("targetLost", function () {
          videoEl.pause();
          statusText.innerText = "PAUSED // POINT AT IMAGE";
        });

        // 5. Controls Dock
        let zRotation = 0;
        let currentScale = 1.8;

        document.getElementById('btn-rot-left').addEventListener('click', function () {
          zRotation -= 15;
          scalerEl.setAttribute('rotation', '0 0 ' + zRotation);
        });

        document.getElementById('btn-rot-right').addEventListener('click', function () {
          zRotation += 15;
          scalerEl.setAttribute('rotation', '0 0 ' + zRotation);
        });

        document.getElementById('btn-reset-scale').addEventListener('click', function () {
          currentScale = 1.8;
          zRotation = 0;
          scalerEl.setAttribute('scale', '1.8 1.8 1.8');
          scalerEl.setAttribute('rotation', '0 0 0');
        });

        document.getElementById('btn-replay').addEventListener('click', function () {
          videoEl.currentTime = 0;
          videoEl.play();
        });

        muteBtn.addEventListener('click', function () {
          videoEl.muted = !videoEl.muted;
          muteBtn.innerText = videoEl.muted ? "UNMUTE" : "MUTE";
          if (!videoEl.muted && videoEl.paused) {
            videoEl.play();
          }
          if (!videoEl.muted) {
            statusText.innerText = "LOCKED // PINCH TO RESIZE";
          }
        });

        // 6. Two-Finger Pinch-to-Resize
        let initialDistance = null;
        let startScale = 1.8;

        function getTouchDistance(touches) {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          return Math.hypot(dx, dy);
        }

        window.addEventListener('touchstart', function (e) {
          if (!splashScreen.classList.contains('hidden')) return;
          if (e.touches.length === 2) {
            initialDistance = getTouchDistance(e.touches);
            startScale = currentScale;
          }
        }, { passive: false });

        window.addEventListener('touchmove', function (e) {
          if (!splashScreen.classList.contains('hidden')) return;
          if (e.touches.length === 2 && initialDistance) {
            e.preventDefault();
            const newDistance = getTouchDistance(e.touches);
            const ratio = newDistance / initialDistance;
            currentScale = Math.min(Math.max(startScale * ratio, 0.5), 4.5);
            scalerEl.setAttribute('scale', currentScale + ' ' + currentScale + ' ' + currentScale);
          }
        }, { passive: false });

        window.addEventListener('touchend', function (e) {
          if (e.touches.length < 2) {
            initialDistance = null;
          }
        });
      })();
    </script>
  </body>
</html>
